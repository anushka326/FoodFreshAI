services:
  - type: web
    name: foodfreshai-backend
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements-render.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false

