<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d841e" />
      <stop offset="60%" stop-color="#1e5128" />
      <stop offset="100%" stop-color="#14381b" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ad967" />
      <stop offset="100%" stop-color="#2d841e" />
    </linearGradient>
  </defs>
  
  <!-- Apple Contour & Leaf Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Apple contour -->
    <path d="M50 20 C65 20, 78 30, 84 44 C88 56, 84 72, 76 84 C68 96, 58 100, 50 96 C42 100, 32 96, 24 84 C16 72, 12 56, 16 44 C22 30, 35 20, 50 20 Z" 
          stroke="url(#brandGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />
    <!-- Botanical Leaf Emblem -->
    <path d="M50 22 C30 2, 8 18, 6 42 C12 60, 34 58, 50 22 Z" fill="url(#leafGrad)" />
    <path d="M12 40 Q28 32 44 26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9" />
  </g>

  <!-- Typography: FoodFresh AI -->
  <text x="120" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="44" fill="#013a13" letter-spacing="-0.03em">
    FoodFresh <tspan fill="#006e1c">AI</tspan>
  </text>
  <text x="122" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="14" fill="#1e5128" letter-spacing="0.02em" opacity="0.85">
    Know. Save. Waste Less.
  </text>
</svg>
